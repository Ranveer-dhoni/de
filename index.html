<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container card">
    <h2>Space Hub Login</h2>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <select id="role">
        <option value="teacher">Teacher</option>
        <option value="student">Student</option>
    </select>

    <button onclick="login()">Login</button>
</div>

<script>
    const accounts = [
        { username: "teacher", password: "1234", role: "teacher" },
        { username: "student", password: "5678", role: "student" }
    ];

    function login() {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        const selectedRole = document.getElementById("role").value;

        if (!username || !password) {
            alert("Enter username and password");
            return;
        }

        const match = accounts.find(
            acc => acc.username === username &&
                   acc.password === password &&
                   acc.role === selectedRole
        );

        if (!match) {
            alert("Invalid login details");
            return;
        }

        localStorage.setItem("username", match.username);
        localStorage.setItem("role", match.role);

        location.href = "home.html";
    }
</script>

</body>
</html>
