<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body onload="checkAccess()">

<div class="nav-bar card">
    <button class="nav-btn" onclick="location.href='home.html'">Home</button>
    <button class="nav-btn" onclick="location.href='dashboard.html'">Dashboard</button>
    <button class="nav-btn" onclick="location.href='calendar.html'">Calendar</button>
    <button class="nav-btn" onclick="location.href='bookings.html'">Bookings</button>
    <button class="nav-btn" onclick="location.href='events.html'">Events</button>
</div>

<div class="container">

    <div class="card">
        <h3>Summary</h3>
        <p id="totalBookings">Total Current Bookings: 0</p>
        <p id="totalEvents">Total Events: 0</p>
    </div>

    <h2>Event Planner</h2>

    <div id="teacherEventSection" class="card">
        <h3>Create Event</h3>

        <input id="eventName" placeholder="Event Name">
        <input id="eventDate" type="date">
        <textarea id="eventDescription" placeholder="Describe the event..."></textarea>

        <button onclick="createEvent()">Add Event</button>
    </div>

    <div class="card">
        <h3>Events</h3>
        <ul id="eventList"></ul>
    </div>

</div>

<script src="auth.js" defer></script>
<script src="script.js" defer></script>

</body>
</html>
